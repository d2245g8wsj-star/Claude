name: Breakwater

on:
  push:
    branches: ["**"]
    # Path filters do not apply to tag pushes, so a breakwater-v* tag always builds.
    tags: ["breakwater-v*"]
    paths:
      - "plugins/breakwater/**"
      - ".github/workflows/breakwater.yml"
  pull_request:
    paths:
      - "plugins/breakwater/**"
      - ".github/workflows/breakwater.yml"
  workflow_dispatch:
    inputs:
      release:
        description: "Publish this commit as a versioned release, tagged with the version in CMakeLists.txt"
        type: boolean
        default: false

jobs:
  checks:
    name: Linux build and offline checks
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libx11-dev libxext-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev libfreetype-dev libfontconfig1-dev libasound2-dev

      - name: Configure
        working-directory: plugins/breakwater
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBREAKWATER_BUILD_TESTS=ON

      - name: Build
        working-directory: plugins/breakwater
        run: cmake --build build --parallel

      - name: Offline checks
        working-directory: plugins/breakwater
        run: ./build/breakwater_tests_artefacts/Release/breakwater_tests

  macos:
    name: macOS universal build
    runs-on: macos-14
    needs: checks
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        working-directory: plugins/breakwater
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13 \
            -DBREAKWATER_BUILD_TESTS=ON

      - name: Build
        working-directory: plugins/breakwater
        run: cmake --build build --parallel 3

      - name: Offline checks
        working-directory: plugins/breakwater
        run: ./build/breakwater_tests_artefacts/Release/breakwater_tests

      - name: Sign ad-hoc and package
        working-directory: plugins/breakwater
        run: |
          set -euo pipefail
          staging="$RUNNER_TEMP/Breakwater"
          mkdir -p "$staging"

          for bundle in VST3/Breakwater.vst3 AU/Breakwater.component Standalone/Breakwater.app; do
            codesign --force --deep --sign - --timestamp=none "build/Breakwater_artefacts/Release/$bundle"
            cp -R "build/Breakwater_artefacts/Release/$bundle" "$staging/"
          done

          cp README.md "$staging/"
          ditto -c -k --sequesterRsrc --keepParent "$staging" "$RUNNER_TEMP/Breakwater-macOS.zip"

      # Run artifacts count against the account's Actions storage quota; when
      # that is full the build itself is still good, so it does not fail the run.
      - name: Upload
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: Breakwater-macOS-universal
          path: ${{ runner.temp }}/Breakwater-macOS.zip
          if-no-files-found: error

      # Release assets do not count against that quota. An breakwater-v* tag makes
      # a versioned release; every other push replaces the rolling
      # "breakwater-latest" pre-release, whose tag the workflow creates itself.
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/') || github.ref_name == github.event.repository.default_branch || inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ inputs.release }}
        run: |
          set -euo pipefail
          notes="Universal (arm64 + x86_64) VST3, AU and standalone, signed ad-hoc, built from ${GITHUB_SHA::7}. Before installing: xattr -dr com.apple.quarantine Breakwater.vst3 Breakwater.component Breakwater.app"

          built="$(sed -nE 's/^project\(Breakwater VERSION ([0-9.]+).*/\1/p' plugins/breakwater/CMakeLists.txt)"

          # A release comes from a breakwater-v* tag, or from running the workflow by
          # hand with "release" ticked, which tags this commit itself.
          if [[ "$GITHUB_REF" == refs/tags/breakwater-v* || "$RELEASE" == "true" ]]; then
            tag="breakwater-v$built"
            if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "$tag" ]]; then
              echo "::error::Tag is $GITHUB_REF_NAME but plugins/breakwater/CMakeLists.txt says $built"
              exit 1
            fi
            version="$built"
            # Below 1.0 every release is a public beta.
            if [[ "$version" == 0.* ]]; then label="$version beta"; pre=--prerelease; else label="$version"; pre=; fi
            asset="$RUNNER_TEMP/Breakwater-$version-macOS.zip"
            mv "$RUNNER_TEMP/Breakwater-macOS.zip" "$asset"
            gh release create "$tag" $pre --target "$GITHUB_SHA" --title "Breakwater $label" --notes "$notes" "$asset" \
              || gh release upload "$tag" "$asset" --clobber
          else
            gh release delete breakwater-latest --yes --cleanup-tag || true
            gh release create breakwater-latest --prerelease --target "$GITHUB_SHA" \
              --title "Breakwater (latest build)" --notes "$notes" "$RUNNER_TEMP/Breakwater-macOS.zip"
          fi
