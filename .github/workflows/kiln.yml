name: Kiln

on:
  push:
    branches: ["**"]
    # Path filters do not apply to tag pushes, so a kiln-v* tag always builds.
    tags: ["kiln-v*"]
    paths:
      - "plugins/kiln/**"
      - ".github/workflows/kiln.yml"
  pull_request:
    paths:
      - "plugins/kiln/**"
      - ".github/workflows/kiln.yml"
  workflow_dispatch:

jobs:
  checks:
    name: Linux build and offline checks
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libx11-dev libxext-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev libfreetype-dev libfontconfig1-dev libasound2-dev

      - name: Configure
        working-directory: plugins/kiln
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DKILN_BUILD_TESTS=ON

      - name: Build
        working-directory: plugins/kiln
        run: cmake --build build --parallel

      - name: Offline checks
        working-directory: plugins/kiln
        run: ./build/kiln_tests_artefacts/Release/kiln_tests

  macos:
    name: macOS universal build
    runs-on: macos-14
    needs: checks
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        working-directory: plugins/kiln
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13 \
            -DKILN_BUILD_TESTS=ON

      - name: Build
        working-directory: plugins/kiln
        run: cmake --build build --parallel 3

      - name: Offline checks
        working-directory: plugins/kiln
        run: ./build/kiln_tests_artefacts/Release/kiln_tests

      - name: Sign ad-hoc and package
        working-directory: plugins/kiln
        run: |
          set -euo pipefail
          staging="$RUNNER_TEMP/Kiln"
          mkdir -p "$staging"

          for bundle in VST3/Kiln.vst3 AU/Kiln.component Standalone/Kiln.app; do
            codesign --force --deep --sign - --timestamp=none "build/Kiln_artefacts/Release/$bundle"
            cp -R "build/Kiln_artefacts/Release/$bundle" "$staging/"
          done

          cp README.md "$staging/"
          ditto -c -k --sequesterRsrc --keepParent "$staging" "$RUNNER_TEMP/Kiln-macOS.zip"

      # Run artifacts count against the account's Actions storage quota; when
      # that is full the build itself is still good, so it does not fail the run.
      - name: Upload
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: Kiln-macOS-universal
          path: ${{ runner.temp }}/Kiln-macOS.zip
          if-no-files-found: error

      # Release assets do not count against that quota. A kiln-v* tag makes
      # a versioned release; every other push replaces the rolling
      # "kiln-latest" pre-release, whose tag the workflow creates itself.
      - name: Attach to release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes="Universal (arm64 + x86_64) VST3, AU and standalone, signed ad-hoc, built from ${GITHUB_SHA::7}. Before installing: xattr -dr com.apple.quarantine Kiln.vst3 Kiln.component Kiln.app"

          if [[ "$GITHUB_REF" == refs/tags/kiln-v* ]]; then
            version="${GITHUB_REF_NAME#kiln-v}"
            asset="$RUNNER_TEMP/Kiln-$version-macOS.zip"
            mv "$RUNNER_TEMP/Kiln-macOS.zip" "$asset"
            gh release create "$GITHUB_REF_NAME" --title "Kiln $version" --notes "$notes" "$asset" \
              || gh release upload "$GITHUB_REF_NAME" "$asset" --clobber
          else
            gh release delete kiln-latest --yes --cleanup-tag || true
            gh release create kiln-latest --prerelease --target "$GITHUB_SHA" \
              --title "Kiln (latest build)" --notes "$notes" "$RUNNER_TEMP/Kiln-macOS.zip"
          fi
