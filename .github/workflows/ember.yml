name: Ember

on:
  push:
    branches: ["**"]
    # Path filters do not apply to tag pushes, so an ember-v* tag always builds.
    tags: ["ember-v*"]
    paths:
      - "plugins/ember/**"
      - ".github/workflows/ember.yml"
  pull_request:
    paths:
      - "plugins/ember/**"
      - ".github/workflows/ember.yml"
  workflow_dispatch:

jobs:
  checks:
    name: Linux build and offline checks
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libx11-dev libxext-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev libfreetype-dev libfontconfig1-dev libasound2-dev

      - name: Configure
        working-directory: plugins/ember
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DEMBER_BUILD_TESTS=ON

      - name: Build
        working-directory: plugins/ember
        run: cmake --build build --parallel

      - name: Offline checks
        working-directory: plugins/ember
        run: ./build/ember_tests_artefacts/Release/ember_tests

  macos:
    name: macOS universal build
    runs-on: macos-14
    needs: checks
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        working-directory: plugins/ember
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13 \
            -DEMBER_BUILD_TESTS=ON

      - name: Build
        working-directory: plugins/ember
        run: cmake --build build --parallel 3

      - name: Offline checks
        working-directory: plugins/ember
        run: ./build/ember_tests_artefacts/Release/ember_tests

      - name: Sign ad-hoc and package
        working-directory: plugins/ember
        run: |
          set -euo pipefail
          staging="$RUNNER_TEMP/Ember"
          mkdir -p "$staging"

          for bundle in VST3/Ember.vst3 AU/Ember.component Standalone/Ember.app; do
            codesign --force --deep --sign - --timestamp=none "build/Ember_artefacts/Release/$bundle"
            cp -R "build/Ember_artefacts/Release/$bundle" "$staging/"
          done

          cp README.md "$staging/"
          ditto -c -k --sequesterRsrc --keepParent "$staging" "$RUNNER_TEMP/Ember-macOS.zip"

      # Run artifacts count against the account's Actions storage quota; when
      # that is full the build itself is still good, so it does not fail the run.
      - name: Upload
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: Ember-macOS-universal
          path: ${{ runner.temp }}/Ember-macOS.zip
          if-no-files-found: error

      # Release assets do not count against that quota.
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/ember-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#ember-v}"
          mv "$RUNNER_TEMP/Ember-macOS.zip" "$RUNNER_TEMP/Ember-$version-macOS.zip"
          gh release create "$GITHUB_REF_NAME" \
            --title "Ember $version" \
            --notes "Universal (arm64 + x86_64) VST3, AU and standalone, signed ad-hoc. Before installing: xattr -dr com.apple.quarantine Ember.vst3 Ember.component Ember.app" \
            "$RUNNER_TEMP/Ember-$version-macOS.zip" \
            || gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP/Ember-$version-macOS.zip" --clobber
