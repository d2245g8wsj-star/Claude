[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vocalai"
version = "1.0.0"
description = "Automatic, musically-aware vocal tuning and alignment for a whole session"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.scripts]
vocalai = "vocalai.cli:main"

[tool.setuptools.packages.find]
include = ["vocalai*"]

[tool.ruff]
line-length = 100
target-version = "py310"
