name: Hinge

on:
  push:
    branches: ["**"]
    # Path filters do not apply to tag pushes, so a hinge-v* tag always builds.
    tags: ["hinge-v*"]
    paths:
      - "plugins/hinge/**"
      - ".github/workflows/hinge.yml"
  pull_request:
    paths:
      - "plugins/hinge/**"
      - ".github/workflows/hinge.yml"
  workflow_dispatch:

jobs:
  checks:
    name: Linux build and offline checks
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libx11-dev libxext-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev libfreetype-dev libfontconfig1-dev libasound2-dev

      - name: Configure
        working-directory: plugins/hinge
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DHINGE_BUILD_TESTS=ON

      - name: Build
        working-directory: plugins/hinge
        run: cmake --build build --parallel

      - name: Offline checks
        working-directory: plugins/hinge
        run: ./build/hinge_tests_artefacts/Release/hinge_tests

  macos:
    name: macOS universal build
    runs-on: macos-14
    needs: checks
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        working-directory: plugins/hinge
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13 \
            -DHINGE_BUILD_TESTS=ON

      - name: Build
        working-directory: plugins/hinge
        run: cmake --build build --parallel 3

      - name: Offline checks
        working-directory: plugins/hinge
        run: ./build/hinge_tests_artefacts/Release/hinge_tests

      - name: Sign ad-hoc and package
        working-directory: plugins/hinge
        run: |
          set -euo pipefail
          staging="$RUNNER_TEMP/Hinge"
          mkdir -p "$staging"

          for bundle in VST3/Hinge.vst3 AU/Hinge.component Standalone/Hinge.app; do
            codesign --force --deep --sign - --timestamp=none "build/Hinge_artefacts/Release/$bundle"
            cp -R "build/Hinge_artefacts/Release/$bundle" "$staging/"
          done

          cp README.md "$staging/"
          ditto -c -k --sequesterRsrc --keepParent "$staging" "$RUNNER_TEMP/Hinge-macOS.zip"

      # Run artifacts count against the account's Actions storage quota; when
      # that is full the build itself is still good, so it does not fail the run.
      - name: Upload
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: Hinge-macOS-universal
          path: ${{ runner.temp }}/Hinge-macOS.zip
          if-no-files-found: error

      # Release assets do not count against that quota. A hinge-v* tag makes
      # a versioned release; every other push replaces the rolling
      # "hinge-latest" pre-release, whose tag the workflow creates itself.
      - name: Attach to release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes="Universal (arm64 + x86_64) VST3, AU and standalone, signed ad-hoc, built from ${GITHUB_SHA::7}. Before installing: xattr -dr com.apple.quarantine Hinge.vst3 Hinge.component Hinge.app"

          if [[ "$GITHUB_REF" == refs/tags/hinge-v* ]]; then
            version="${GITHUB_REF_NAME#hinge-v}"
            asset="$RUNNER_TEMP/Hinge-$version-macOS.zip"
            mv "$RUNNER_TEMP/Hinge-macOS.zip" "$asset"
            gh release create "$GITHUB_REF_NAME" --title "Hinge $version" --notes "$notes" "$asset" \
              || gh release upload "$GITHUB_REF_NAME" "$asset" --clobber
          else
            gh release delete hinge-latest --yes --cleanup-tag || true
            gh release create hinge-latest --prerelease --target "$GITHUB_SHA" \
              --title "Hinge (latest build)" --notes "$notes" "$RUNNER_TEMP/Hinge-macOS.zip"
          fi
